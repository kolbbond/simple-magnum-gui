name: ci

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libsdl2-dev libgl1-mesa-dev xorg-dev ccache \
            xvfb libgl1-mesa-dri

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_EXAMPLES=ON
          -DSMG_BUILD_GUI_TESTS=ON
          -DCMAKE_INSTALL_PREFIX=${{ runner.temp }}/smg
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build

      - name: Unit tests (headless)
        run: ctest --test-dir build -L unit --output-on-failure

      # software GL (llvmpipe) under a virtual X server; tests self-exit via SMG_TEST_FRAMES
      - name: GUI tests (xvfb)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ctest --test-dir build -L gui --output-on-failure

      # the contract downstream projects rely on: install, then find_package(smg)
      - name: Install
        run: cmake --install build

      - name: Consumer smoke test
        run: |
          cmake -S test/consumer -B build-consumer -G Ninja -DCMAKE_PREFIX_PATH=${{ runner.temp }}/smg
          cmake --build build-consumer
          ctest --test-dir build-consumer --output-on-failure
